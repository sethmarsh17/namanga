  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

87a151ee\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"d0fae04c-2bc6-4a65-85c4-074dbe6db79a\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #F4F0E6; }\n  a { color: #17683C; text-decoration: none; }\n  a:hover { color: #E4A11B; }\n  input, select, textarea { font-family: 'Libre Franklin', sans-serif; }\n  [data-row]:hover { background: #FAF6EE; }\n  [data-nav]:hover { background: rgba(255,255,255,0.08); }\n  [data-side] { display: flex; }\n  [data-burger] { display: none; }\n  @media (max-width: 900px) {\n    [data-side] { display: none; }\n    [data-side][data-open=\"true\"] { display: flex; position: fixed; inset: 0 auto 0 0; z-index: 60; box-shadow: 0 0 60px rgba(0,0,0,0.4); }\n    [data-burger] { display: flex; }\n    [data-main] { padding: 18px !important; }\n    [data-search] { display: none; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Libre Franklin', sans-serif; color: #22302A; display: flex; min-height: 100vh;\">\n\n  <!-- SIDEBAR -->\n  <div data-side=\"\" data-open=\"{{ sideOpen }}\" style=\"width: 248px; flex: none; background: #0E4429; color: #fff; flex-direction: column;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);\">\n      <div style=\"width: 40px; height: 40px; border-radius: 50%; background: #FAF6EE; border: 2px solid #E4A11B; display: flex; align-items: center; justify-content: center; flex: none;\">\n        <img src=\"528aac6f-efe5-46b4-b797-8f23367b4914\" alt=\"\" style=\"width: 28px; height: auto;\">\n      <\u002Fdiv>\n      <div style=\"line-height: 1.1;\">\n        <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 15px;\">Namanga Hope Center<\u002Fdiv>\n        <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #E4A11B;\">MANAGEMENT<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; overflow-y: auto; padding: 14px 12px;\">\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <div style=\"margin-bottom: 18px;\">\n          <div style=\"padding: 0 12px 6px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45);\">{{ g.label }}<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n            <sc-for list=\"{{ g.items }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <div data-nav=\"\" sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\">\n                <span style=\"width: 20px; text-align: center; font-size: 15px;\">{{ n.icon }}<\u002Fspan>\n                <span style=\"flex: 1;\">{{ n.label }}<\u002Fspan>\n                <sc-if value=\"{{ n.hasBadge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background: #E4A11B; color: #0E4429; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;\">{{ n.badge }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px;\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #E4A11B; color: #0E4429; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 14px;\">RO<\u002Fdiv>\n      <div style=\"line-height: 1.15; flex: 1; min-width: 0;\">\n        <div style=\"font-weight: 700; font-size: 13.5px;\">Richard Otieno<\u002Fdiv>\n        <div style=\"font-size: 11.5px; color: rgba(255,255,255,0.6);\">Viewing as {{ role }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAIN -->\n  <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n    <!-- Topbar -->\n    <div style=\"height: 64px; background: #fff; border-bottom: 1px solid rgba(14,68,41,0.1); display: flex; align-items: center; gap: 14px; padding: 0 22px;\">\n      <div data-burger=\"\" sc-camel-on-click=\"{{ toggleSide }}\" style=\"width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid rgba(14,68,41,0.15); align-items: center; justify-content: center; flex-direction: column; gap: 4px; cursor: pointer;\">\n        <span style=\"width: 18px; height: 2px; background: #0E4429;\"><\u002Fspan><span style=\"width: 18px; height: 2px; background: #0E4429;\"><\u002Fspan><span style=\"width: 18px; height: 2px; background: #0E4429;\"><\u002Fspan>\n      <\u002Fdiv>\n      <div data-search=\"\" style=\"flex: 1; max-width: 420px; display: flex; align-items: center; gap: 10px; background: #F4F0E6; border-radius: 10px; padding: 9px 14px;\">\n        <span style=\"color: #8A8271;\">⌕<\u002Fspan>\n        <input value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"Search children, sponsors, staff, stock…\" style=\"flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: #22302A;\">\n      <\u002Fdiv>\n      <div style=\"flex: 1;\"><\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 8px; font-size: 13px;\">\n        <span style=\"color: #8A8271; font-weight: 600;\">Viewing as<\u002Fspan>\n        <sc-raw-select value=\"{{ role }}\" sc-camel-on-change=\"{{ onRole }}\" style=\"border: 1.5px solid rgba(14,68,41,0.15); border-radius: 9px; padding: 7px 10px; font-size: 13px; font-weight: 700; color: #0E4429; background: #fff;\">\n          <option value=\"Director\">Director<\u002Foption>\n          <option value=\"Finance Officer\">Finance Officer<\u002Foption>\n          <option value=\"Caregiver\">Caregiver<\u002Foption>\n          <option value=\"Read-only\">Read-only<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <a href=\"index.html\" target=\"_blank\" style=\"font-size: 13px; font-weight: 700; color: #17683C; white-space: nowrap;\">View site ↗<\u002Fa>\n    <\u002Fdiv>\n\n    <div data-main=\"\" style=\"padding: 28px 32px; max-width: 1180px; width: 100%; box-sizing: border-box; margin: 0 auto;\">\n\n      <!-- ===== DASHBOARD ===== -->\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Good morning, Richard.<\u002Fh1>\n          <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">Here's how the center is doing today — {{ today }}.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-top: 24px;\">\n            <div style=\"background: linear-gradient(155deg, #17683C, #0E4429); color: #fff; border-radius: 18px; padding: 20px;\">\n              <div style=\"font-family: 'Spectral', serif; font-size: 34px; font-weight: 800; line-height: 1;\">{{ totalChildren }}<\u002Fdiv>\n              <div style=\"font-size: 13px; margin-top: 6px; opacity: 0.9; font-weight: 600;\">Children in care<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: linear-gradient(155deg, #E4A11B, #C4622D); color: #fff; border-radius: 18px; padding: 20px;\">\n              <div style=\"font-family: 'Spectral', serif; font-size: 34px; font-weight: 800; line-height: 1;\">{{ sponsoredPct }}%<\u002Fdiv>\n              <div style=\"font-size: 13px; margin-top: 6px; opacity: 0.95; font-weight: 600;\">Sponsorship coverage<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: linear-gradient(155deg, #2A7E7B, #1D5A58); color: #fff; border-radius: 18px; padding: 20px;\">\n              <div style=\"font-family: 'Spectral', serif; font-size: 34px; font-weight: 800; line-height: 1;\">{{ netLabel }}<\u002Fdiv>\n              <div style=\"font-size: 13px; margin-top: 6px; opacity: 0.9; font-weight: 600;\">Net this month (KES)<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: linear-gradient(155deg, #7C3A57, #5A2840); color: #fff; border-radius: 18px; padding: 20px;\">\n              <div style=\"font-family: 'Spectral', serif; font-size: 34px; font-weight: 800; line-height: 1;\">{{ lowStockCount }}<\u002Fdiv>\n              <div style=\"font-size: 13px; margin-top: 6px; opacity: 0.9; font-weight: 600;\">Low-stock items<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px;\">\n            <!-- Coverage + spotlight -->\n            <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;\">\n              <div style=\"position: relative; width: 150px; height: 150px; flex: none;\">\n                <svg width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\">\n                  <circle cx=\"75\" cy=\"75\" r=\"66\" fill=\"none\" stroke=\"#EDE7DA\" stroke-width=\"14\"><\u002Fcircle>\n                  <circle cx=\"75\" cy=\"75\" r=\"66\" fill=\"none\" stroke=\"#17683C\" stroke-width=\"14\" stroke-linecap=\"round\" stroke-dasharray=\"{{ ringDash }}\" transform=\"rotate(-90 75 75)\" style=\"transition: stroke-dasharray 1.2s ease;\"><\u002Fcircle>\n                <\u002Fsvg>\n                <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;\">\n                  <span style=\"font-family: 'Spectral', serif; font-size: 36px; font-weight: 800; color: #0E4429; line-height: 1;\">{{ sponsoredCount }}<\u002Fspan>\n                  <span style=\"font-size: 11px; color: #52606A; margin-top: 3px;\">of {{ totalChildren }} sponsored<\u0 -fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px;\">\n            <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n              <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429; margin-bottom: 14px;\">Budget vs. actual<\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                <sc-for list=\"{{ budgetRows }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <div>\n                    <div style=\"display: flex; justify-content: space-between; font-size: 13px; font-weight: 700;\"><span>{{ b.cat }}<\u002Fspan><span style=\"color: #52606A;\">{{ b.label }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"height: 8px; background: #EDE7DA; border-radius: 999px; overflow: hidden; margin-top: 6px;\"><div style=\"height: 100%; width: {{ b.pct }}; background: {{ b.color }};\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n              <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429; margin-bottom: 8px;\">Ledger<\u002Fdiv>\n              <sc-for list=\"{{ ledger }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(14,68,41,0.07);\">\n                  <div style=\"flex: 1; min-width: 0;\"><div style=\"font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ t.desc }}<\u002Fdiv><div style=\"font-size: 11.5px; color: #8A8271;\">{{ t.date }} · {{ t.cat }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-weight: 800; font-size: 14px; color: {{ t.color }}; white-space: nowrap;\">{{ t.amount }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== INVENTORY ===== -->\n      <sc-if value=\"{{ isInventory }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n            <div>\n              <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Inventory<\u002Fh1>\n              <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">{{ lowStockCount }} items below minimum level<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px;\"><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ secondaryBtn }}\">Issue stock<\u002Fdiv><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ primaryBtn }}\">Receive stock<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; margin-top: 20px; overflow: hidden;\">\n            <div style=\"display: grid; grid-template-columns: 2fr 1fr 2fr 1fr; gap: 12px; padding: 12px 20px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8271; border-bottom: 1px solid rgba(14,68,41,0.08);\">\n              <span>Item<\u002Fspan><span>Category<\u002Fspan><span>Stock level<\u002Fspan><span>Status<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ stockRows }}\" as=\"i\" hint-placeholder-count=\"8\">\n              <div data-row=\"\" style=\"display: grid; grid-template-columns: 2fr 1fr 2fr 1fr; gap: 12px; padding: 13px 20px; align-items: center; border-bottom: 1px solid rgba(14,68,41,0.06); font-size: 14px;\">\n                <span style=\"font-weight: 700;\">{{ i.name }}<\u002Fspan>\n                <span style=\"color: #52606A;\">{{ i.cat }}<\u002Fspan>\n                <div style=\"display: flex; align-items: center; gap: 10px;\">\n                  <div style=\"flex: 1; height: 8px; background: #EDE7DA; border-radius: 999px; overflow: hidden;\"><div style=\"height: 100%; width: {{ i.pct }}; background: {{ i.color }};\"><\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size: 12.5px; color: #52606A; white-space: nowrap;\">{{ i.stock }} / {{ i.min }} {{ i.unit }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"{{ i.badgeStyle }}\">{{ i.badge }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== STAFF ===== -->\n      <sc-if value=\"{{ isStaff }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Staff &amp; Volunteers<\u002Fh1>\n          <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">{{ staffCount }} staff · {{ volunteerCount }} volunteers<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 20px;\">\n            <sc-for list=\"{{ staffCards }}\" as=\"s\" hint-placeholder-count=\"9\">\n              <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 16px; padding: 18px; display: flex; gap: 12px; align-items: center;\">\n                <div style=\"width: 46px; height: 46px; border-radius: 50%; background: {{ s.color }}; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none;\">{{ s.initials }}<\u002Fdiv>\n                <div style=\"min-width: 0; flex: 1;\">\n                  <div style=\"font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ s.name }}<\u002Fdiv>\n                  <div style=\"font-size: 12.5px; color: #52606A;\">{{ s.title }}<\u002Fdiv>\n                  <span style=\"{{ s.typeStyle }}\">{{ s.typeLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px; margin-top: 16px;\">\n            <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429;\">Attendance · last 14 days<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin-top: 14px; align-items: center;\">\n              <sc-for list=\"{{ heat }}\" as=\"h\" hint-placeholder-count=\"9\">\n                <div style=\"font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ h.name }}<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px;\">\n                  <sc-for list=\"{{ h.days }}\" as=\"d\" hint-placeholder-count=\"14\"><div style=\"height: 18px; border-radius: 4px; background: {{ d }};\"><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== REPORTS ===== -->\n      <sc-if value=\"{{ isReports }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Reports<\u002Fh1>\n          <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">Summaries for the board, Hope for Kajiado, and donors. Export as CSV or print.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 20px;\">\n            <sc-for list=\"{{ reports }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n                <div style=\"font-size: 26px;\">{{ r.icon }}<\u002Fdiv>\n                <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 19px; color: #0E4429; margin-top: 8px;\">{{ r.name }}<\u002Fdiv>\n                <p style=\"font-size: 13.5px; line-height: 1.55; color: #52606A; margin: 6px 0 14px;\">{{ r.desc }}<\u002Fp>\n                <div style=\"display: flex; gap: 8px;\"><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ secondaryBtn }}\">Export CSV<\u002Fdiv><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ secondaryBtn }}\">Print<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== POSTS (Richard's website tool) ===== -->\n      <sc-if value=\"{{ isPosts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n            <div>\n              <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Website updates<\u002Fh1>\n              <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">Post progress to the public site. Subscribers get an email for the categories they chose.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; align-items: start;\">\n            <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n              <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429;\">New update<\u002Fdiv>\n              <input value=\"{{ postTitle }}\" sc-camel-on-input=\"{{ onPostTitle }}\" placeholder=\"Title\" style=\"width: 100%; box-sizing: border-box; margin-top: 14px; padding: 12px 14px; border: 1.5px solid rgba(14,68,41,0.15); border-radius: 10px; font-size: 15px; font-weight: 700; outline: none;\">\n              <div style=\"display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;\">\n                <sc-for list=\"{{ postCatChips }}\" as=\"c\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <textarea value=\"{{ postBody }}\" sc-camel-on-input=\"{{ onPostBody }}\" placeholder=\"What's happening in Namanga? Write it the way you'd tell a friend.\" rows=\"5\" style=\"width: 100%; box-sizing: border-box; margin-top: 12px; padding: 12px 14px; border: 1.5px solid rgba(14,68,41,0.15); border-radius: 10px; font-size: 14px; line-height: 1.5; outline: none; resize: vertical;\"><\u002Ftextarea>\n              <div style=\"height: 140px; border-radius: 12px; overflow: hidden; margin-top: 12px; border: 1.5px dashed rgba(14,68,41,0.2);\">\n                <image-slot id=\"post-compose-photo\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a photo for this update\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; flex-wrap: wrap;\">\n                <span style=\"font-size: 12.5px; color: #8A8271;\">Will notify <strong>{{ notifyCount }}<\u002Fstrong> subscribers<\u002Fspan>\n                <div style=\"display: flex; gap: 8px;\"><div sc-camel-on-click=\"{{ saveDraft }}\" style=\"{{ secondaryBtn }}\">Save draft<\u002Fdiv><div sc-camel-on-click=\"{{ publish }}\" style=\"{{ publishBtn }}\">Publish to site<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n              <sc-for list=\"{{ postRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 16px; overflow: hidden; display: flex;\">\n                  <div style=\"width: 110px; flex: none; background: #EDE7DA;\"><image-slot id=\"{{ p.slot }}\" shape=\"rect\" fit=\"cover\" src=\"{{ p.img }}\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n                  <div style=\"padding: 14px 16px; flex: 1; min-width: 0;\">\n                    <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap;\">\n                      <span style=\"font-size: 11px; font-weight: 800; color: #fff; background: {{ p.color }}; padding: 3px 9px; border-radius: 999px;\">{{ p.catLabel }}<\u002Fspan>\n                      <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n                      <span style=\"font-size: 11.5px; color: #8A8271;\">{{ p.date }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 16px; color: #0E4429; margin-top: 6px;\">{{ p.title }}<\u002Fdiv>\n                    <div style=\"font-size: 13px; color: #52606A; margin-top: 3px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;\">{{ p.body }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== ADMIN ===== -->\n      <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <h1 style=\"font-family: 'Spectral', serif; font-size: 30px; font-weight: 800; color: #0E4429; margin: 0;\">Administration<\u002Fh1>\n          <p style=\"color: #52606A; margin: 6px 0 0; font-size: 15px;\">Users, roles, activity log, and backups.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 20px;\">\n            <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n              <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429; margin-bottom: 12px;\">Users &amp; roles<\u002Fdiv>\n              <sc-for list=\"{{ users }}\" as=\"u\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(14,68,41,0.07);\">\n                  <div style=\"width: 36px; height: 36px; border-radius: 50%; background: {{ u.color }}; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;\">{{ u.initials }}<\u002Fdiv>\n                  <div style=\"flex: 1;\"><div style=\"font-weight: 700; font-size: 14px;\">{{ u.name }}<\u002Fdiv><div style=\"font-size: 12px; color: #8A8271;\">{{ u.email }}<\u002Fdiv><\u002Fdiv>\n                  <span style=\"font-size: 12px; font-weight: 700; color: #0E4429; background: rgba(23,104,60,0.1); padding: 4px 10px; border-radius: 999px;\">{{ u.role }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size: 12px; color: #8A8271; margin-top: 12px; line-height: 1.5;\">Director: full access · Finance Officer: finance + reports · Caregiver: children + inventory · Read-only: view everything, change nothing.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n              <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n                <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429;\">Backups<\u002Fdiv>\n                <p style=\"font-size: 13.5px; color: #52606A; margin: 6px 0 14px; line-height: 1.5;\">Last backup: today, 03:00 · 2.4 MB. Export a full copy or restore from a file.<\u002Fp>\n                <div style=\"display: flex; gap: 8px;\"><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ primaryBtn }}\">Export backup<\u002Fdiv><div sc-camel-on-click=\"{{ noop }}\" style=\"{{ secondaryBtn }}\">Restore…<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background: #fff; border: 1px solid rgba(14,68,41,0.1); border-radius: 18px; padding: 22px;\">\n                <div style=\"font-family: 'Spectral', serif; font-weight: 800; font-size: 17px; color: #0E4429; margin-bottom: 8px;\">Activity log<\u002Fdiv>\n                <sc-for list=\"{{ activity }}\" as=\"ev\" hint-placeholder-count=\"5\">\n                  <div style=\"display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(14,68,41,0.07); font-size: 13px;\">\n                    <span style=\"color: #8A8271; white-space: nowrap; min-width: 90px;\">{{ ev.when }}<\u002Fspan>\n                    <span><strong>{{ ev.who }}<\u002Fstrong> {{ ev.what }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-size: 12px; color: #8A8271; margin-top: 36px; text-align: center;\">Clickable prototype · every child, sponsor, and figure shown is illustrative sample data, not a real record.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Toast -->\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0E4429; color: #fff; font-size: 13.5px; font-weight: 700; padding: 12px 20px; border-radius: 999px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); z-index: 100;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    D: null, view: 'dashboard', childId: null, childFilter: 'all', query: '', role: 'Director', sideOpen: false,\n    children: [], posts: [], consent: {}, pickSponsor: '', toast: '', postTitle: '', postBody: '', postCat: 'land', ringOn: false,\n  };\n\n  componentDidMount() {\n    import(window.location.origin + '/nhc-admin-data.js').then(D => {\n      this.setState({ D, children: D.CHILDREN.map(c => ({ ...c })), posts: D.POSTS.map(p => ({ ...p })) });\n      setTimeout(() => this.setState({ ringOn: true }), 200);\n    });\n  }\n\n  go(view, extra = {}) { this.setState({ view, sideOpen: false, ...extra }); window.scrollTo({ top: 0 }); }\n  toast(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  initials(n) { return n.split(/\\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }\n  age(dob) { const d = new Date(dob), t = new Date('2026-09-21'); let a = t.getFullYear() - d.getFullYear(); if (t < new Date(t.getFullYear(), d.getMonth(), d.getDate())) a--; return a; }\n  kes(n) { return 'KES ' + Math.round(n).toLocaleString('en-US'); }\n  fmtDate(s) { return new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }\n  can(action) {\n    const r = this.state.role;\n    if (r === 'Read-only') return false;\n    if (action === 'allocate' || action === 'publish') return r === 'Director';\n    return true;\n  }\n\n  renderVals() {\n    const { D, view, children, posts } = this.state;\n    const primaryBtn = 'cursor: pointer; background: #E4A11B; color: #0E4429; font-weight: 800; font-size: 13.5px; padding: 10px 18px; border-radius: 999px; white-space: nowrap;';\n    const secondaryBtn = 'cursor: pointer; background: #fff; border: 1.5px solid rgba(14,68,41,0.18); color: #0E4429; font-weight: 700; font-size: 13.5px; padding: 9px 16px; border-radius: 999px; white-space: nowrap;';\n    const disabledBtn = 'background: #E7E1D4; color: #A9A292; font-weight: 800; font-size: 13.5px; padding: 10px 18px; border-radius: 999px; cursor: not-allowed; white-space: nowrap;';\n    const goodBadge = 'font-size: 11px; font-weight: 800; color: #17683C; background: rgba(23,104,60,0.1); padding: 4px 10px; border-radius: 999px;';\n    const amberBadge = 'font-size: 11px; font-weight: 800; color: #8A5A0E; background: rgba(228,161,27,0.18); padding: 4px 10px; border-radius: 999px;';\n    const dangerBadge = 'font-size: 11px; font-weight: 800; color: #B3402C; background: rgba(179,64,44,0.12); padding: 4px 10px; border-radius: 999px;';\n\n    const base = {\n      isDashboard: view === 'dashboard', isChildren: view === 'children', isChild: view === 'child', isSponsorship: view === 'sponsorship',\n      isPrograms: view === 'programs', isFinance: view === 'finance', isInventory: view === 'inventory', isStaff: view === 'staff',\n      isReports: view === 'reports', isPosts: view === 'posts', isAdmin: view === 'admin',\n      role: this.state.role, onRole: e => this.setState({ role: e.target.value }),\n      query: this.state.query, onQuery: e => this.setState({ query: e.target.value }),\n      sideOpen: String(this.state.sideOpen), toggleSide: () => this.setState(s => ({ sideOpen: !s.sideOpen })),\n      primaryBtn, secondaryBtn, noop: () => this.toast('Prototype — this action will be wired up in the real build.'),\n      hasToast: !!this.state.toast, toast: this.state.toast, today: 'Monday, 21 September 2026',\n      goChildren: () => this.go('children'),\n    };\n    if (!D) return { ...base, navGroups: [], totalChildren: 0 };\n\n    const unsponsored = children.filter(c => !c.sponsor);\n    const sponsoredCount = children.length - unsponsored.length;\n    const pct = Math.round(sponsoredCount / children.length * 100);\n    const lowStock = D.INVENTORY.filter(i => i.stock < i.min);\n    const income = D.TRANSACTIONS.filter(t => t.type === 'income' && t.date >= '2026-09-01').reduce((a, t) => a + t.amount, 0);\n    const expense = D.TRANSACTIONS.filter(t => t.type === 'expense' && t.date >= '2026-09-01').reduce((a, t) => a + t.amount, 0);\n    const net = income - expense;\n\n    const navItem = (id, label, icon, badge) => ({\n      label, icon, badge, hasBadge: !!badge, go: () => this.go(id),\n      style: 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: ' +\n        ((view === id || (id === 'children' && view === 'child')) ? '#0E4429; background: #E4A11B; font-weight: 800;' : 'rgba(255,255,255,0.85);'),\n    });\n    const navGroups = [\n      { label: 'Overview', items: [navItem('dashboard', 'Dashboard', '◎')] },\n      { label: 'Care', items: [navItem('children', 'Children', '☺', unsponsored.length), navItem('sponsorship', 'Sponsorship', '♡'), navItem('programs', 'Programs', '✦')] },\n      { label: 'Operations', items: [navItem('finance', 'Finance', '⊞'), navItem('inventory', 'Inventory', '▤', lowStock.length), navItem('staff', 'Staff & Volunteers', '⚉'), navItem('reports', 'Reports', '▦')] },\n      { label: 'Website', items: [navItem('posts', 'Updates & Posts', '✎')] },\n      { label: 'Administration', items: [navItem('admin', 'Administration', '⚙')] },\n    ];\n\n    const kindColor = { post: '#E4A11B', finance: '#2A7E7B', inventory: '#7C3A57', child: '#17683C', staff: '#C4622D' };\n    const activity = D.ACTIVITY.map(a => ({ ...a, color: kindColor[a.kind] || '#8A8271' }));\n    const maxT = Math.max(...D.TREND.map(t => Math.max(t.inc, t.exp)));\n    const trend = D.TREND.map(t => ({ m: t.m, incH: Math.round(t.inc / maxT * 100) + '%', expH: Math.round(t.exp / maxT * 100) + '%' }));\n    const spot = unsponsored[0] || children[0];\n    const spotlight = { name: spot.name, color: spot.color, initials: this.initials(spot.name), meta: `${this.age(spot.dob)} yrs · ${spot.level} · ${spot.grade}`, background: spot.background, open: () => this.go('child', { childId: spot.id }) };\n    const alerts = [\n      { text: `${unsponsored.length} children still need a sponsor`, color: '#E4A11B', go: () => this.go('children', { childFilter: 'unsponsored' }) },\n      { text: `${lowStock.length} inventory items below minimum (${lowStock.map(i => i.name).slice(0, 2).join(', ')}…)`, color: '#B3402C', go: () => this.go('inventory') },\n      { text: 'Q3 transparency report is still a draft', color: '#2A7E7B', go: () => this.go('posts') },\n    ];\n\n    // Children\n    const q = this.state.query.trim().toLowerCase();\n    let list = children.filter(c => !q || c.name.toLowerCase().includes(q) || c.school.toLowerCase().includes(q) || c.nhc.toLowerCase().includes(q));\n    if (this.state.childFilter === 'sponsored') list = list.filter(c => c.sponsor);\n    if (this.state.childFilter === 'unsponsored') list = list.filter(c => !c.sponsor);\n    const chip = (on) => 'cursor: pointer; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 1.5px solid ' + (on ? '#0E4429; background: #0E4429; color: #fff;' : 'rgba(14,68,41,0.15); background: #fff; color: #52606A;');\n    const childFilters = [['all', `All (${children.length})`], ['sponsored', `Sponsored (${sponsoredCount})`], ['unsponsored', `Unsponsored (${unsponsored.length})`]]\n      .map(([id, label]) => ({ label, go: () => this.setState({ childFilter: id }), style: chip(this.state.childFilter === id) }));\n    const progById = Object.fromEntries(D.PROGRAMS.map(p => [p.id, p]));\n    const childCards = list.map(c => ({\n      ...c, age: this.age(c.dob), initials: this.initials(c.name), open: () => this.go('child', { childId: c.id }),\n      badge: c.sponsor ? 'Sponsored' : 'Needs sponsor', badgeStyle: c.sponsor ? goodBadge : amberBadge, dots: c.programs.map(p => progById[p].color),\n    }));\n\n    // Child detail\n    let child = {};\n    let sponsorOptions = [];\n    if (view === 'child') {\n      const c = children.find(x => x.id === this.state.childId) || children[0];\n      const sp = D.SPONSORS.find(s => s.id === c.sponsor);\n      const consent = !!this.state.consent[c.id];\n      child = {\n        ...c, slot: 'child-photo-' + c.id, age: this.age(c.dob), initials: this.initials(c.name), genderLabel: c.gender === 'F' ? 'Female' : 'Male', admitted: this.fmtDate(c.admitted),\n        badge: c.sponsor ? 'Sponsored' : 'Unsponsored', badgeStyle: c.sponsor ? goodBadge : amberBadge, unsponsored: !c.sponsor,\n        programChips: c.programs.map(p => progById[p]),\n        sponsorName: sp ? sp.name : 'No sponsor yet', sponsorMeta: sp ? `${sp.location} · ${this.kes(sp.monthly)}/month` : `Allocate a sponsor for ${c.name.split(' ')[0]} below.`,\n        consentLabel: consent ? 'Consent on file · shown on site' : 'Not shared publicly', consentColor: consent ? '#17683C' : '#8A8271',\n        consentToggle: 'width: 46px; height: 26px; border-radius: 999px; cursor: pointer; position: relative; transition: background .2s; background: ' + (consent ? '#17683C' : '#D8D2C4'),\n        consentKnob: 'position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; left: ' + (consent ? '23px' : '3px'),\n      };\n      sponsorOptions = D.SPONSORS;\n    }\n\n    // Sponsorship\n    const sponsorRows = D.SPONSORS.map((s, i) => ({ ...s, color: D.AVATAR[i % D.AVATAR.length], initials: this.initials(s.name), monthlyLabel: s.monthly.toLocaleString(), kids: children.filter(c => c.sponsor === s.id).map(c => c.name.split(' ')[0]).join(', ') || '—' }));\n    const monthlyTotal = D.SPONSORS.reduce((a, s) => a + s.monthly, 0).toLocaleString();\n\n    // Programs\n    const programCards = D.PROGRAMS.map(p => { const count = children.filter(c => c.programs.includes(p.id)).length; return { ...p, count, pct: Math.round(count / children.length * 100) + '%' }; });\n\n    // Finance\n    const budgetRows = D.BUDGET.map(b => { const r = b.spent / b.budget; return { cat: b.cat, label: `${b.spent.toLocaleString()} / ${b.budget.toLocaleString()}`, pct: Math.min(100, Math.round(r * 100)) + '%', color: r >= 1 ? '#B3402C' : r > 0.8 ? '#E4A11B' : '#17683C' }; });\n    const ledger = D.TRANSACTIONS.map(t => ({ ...t, date: this.fmtDate(t.date), amount: (t.type === 'income' ? '+' : '−') + t.amount.toLocaleString(), color: t.type === 'income' ? '#17683C' : '#C4622D' }));\n\n    // Inventory\n    const stockRows = D.INVENTORY.map(i => { const r = i.stock / i.min; const low = r < 1; return { ...i, pct: Math.min(100, Math.round(r / 2 * 100)) + '%', color: low ? '#B3402C' : r < 1.3 ? '#E4A11B' : '#17683C', badge: low ? 'Low stock' : r < 1.3 ? 'Watch' : 'OK', badgeStyle: low ? dangerBadge : r < 1.3 ? amberBadge : goodBadge }; });\n\n    // Staff\n    const staffCards = D.STAFF.map((s, i) => ({ ...s, color: D.AVATAR[i % D.AVATAR.length], initials: this.initials(s.name), typeLabel: s.type === 'staff' ? 'Staff' : 'Volunteer', typeStyle: 'display: inline-block; margin-top: 6px; ' + (s.type === 'staff' ? goodBadge : amberBadge) }));\n    const heat = D.STAFF.map((s, i) => ({ name: s.name, days: Array.from({ length: 14 }, (_, d) => { const wk = (d + 1) % 7 === 0 || (d + 2) % 7 === 0; if (wk) return '#F1ECE0'; const seed = (i * 7 + d * 13) % 10; return seed < 8 ? '#17683C' : seed < 9 ? '#E4A11B' : '#EDE7DA'; }) }));\n\n    // Posts\n    const postCatChips = D.POST_CATS.map(c => ({ label: c.label, go: () => this.setState({ postCat: c.id }), style: 'cursor: pointer; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid ' + (this.state.postCat === c.id ? `${c.color}; background: ${c.color}; color: #fff;` : 'rgba(14,68,41,0.15); background: #fff; color: #52606A;') }));\n    const catById = Object.fromEntries(D.POST_CATS.map(c => [c.id, c]));\n    const postRows = posts.map(p => ({ ...p, slot: 'post-' + p.id, catLabel: catById[p.cat].label, color: catById[p.cat].color, date: this.fmtDate(p.date), status: p.status === 'published' ? 'Published' : 'Draft', statusStyle: p.status === 'published' ? goodBadge : amberBadge }));\n    const canPublish = this.state.postTitle.trim() && this.state.postBody.trim() && this.can('publish');\n    const notifyMap = { land: 142, construction: 131, news: 96, finance: 41, volunteer: 38, events: 57 };\n\n    const users = [\n      { name: 'Richard Otieno', email: 'richard@namangahope.org', role: 'Director', color: '#17683C' },\n      { name: 'Joseph Mutua', email: 'joseph.mutua@nhc.or.ke', role: 'Finance Officer', color: '#2A7E7B' },\n      { name: 'Mary Sankale', email: 'mary.sankale@nhc.or.ke', role: 'Caregiver', color: '#C4622D' },\n      { name: 'Hope for Kajiado Board', email: 'board@hope4kajiado.org', role: 'Read-only', color: '#7C3A57' },\n    ].map(u => ({ ...u, initials: this.initials(u.name) }));\n\n    const circ = 2 * Math.PI * 66;\n    return {\n      ...base, navGroups, activity, trend, spotlight, alerts,\n      totalChildren: children.length, sponsoredCount, sponsoredPct: pct, unsponsoredCount: unsponsored.length, unsponsoredMore: Math.max(0, unsponsored.length - 1),\n      ringDash: this.state.ringOn ? `${circ * pct / 100} ${circ}` : `0 ${circ}`,\n      netLabel: (net >= 0 ? '+' : '−') + Math.round(Math.abs(net) / 1000) + 'k', netFull: (net >= 0 ? '+' : '−') + this.kes(Math.abs(net)), incomeLabel: this.kes(income), expenseLabel: this.kes(expense),\n      lowStockCount: lowStock.length,\n      childCountLabel: `${list.length} of ${children.length} children`, childFilters, childCards,\n      child, sponsorOptions, pickSponsor: this.state.pickSponsor, onPickSponsor: e => this.setState({ pickSponsor: e.target.value }),\n      allocateBtn: this.state.pickSponsor && this.can('allocate') ? primaryBtn : disabledBtn,\n      allocate: () => { if (!this.state.pickSponsor || !this.can('allocate')) return this.toast(this.can('allocate') ? 'Pick a sponsor first.' : 'Only the Director can allocate sponsors.'); const sid = +this.state.pickSponsor; this.setState(s => ({ children: s.children.map(c => c.id === s.childId ? { ...c, sponsor: sid } : c), pickSponsor: '' })); this.toast('Sponsor allocated. Finance transaction will follow first payment.'); },\n      toggleConsent: () => this.setState(s => ({ consent: { ...s.consent, [s.childId]: !s.consent[s.childId] } })),\n      sponsorCount: D.SPONSORS.length, monthlyTotal, sponsorRows, programCards, budgetRows, ledger, stockRows,\n      staffCount: D.STAFF.filter(s => s.type === 'staff').length, volunteerCount: D.STAFF.filter(s => s.type === 'volunteer').length, staffCards, heat,\n      reports: [\n        { icon: '☺', name: 'Children summary', desc: 'Every child, age, school, programs, and sponsorship status — the register your board asks for.' },\n        { icon: '♡', name: 'Sponsor summary', desc: 'Sponsors, monthly commitments, payment history, and which children each supports.' },\n        { icon: '⊞', name: 'Financial summary', desc: 'Income, expense, and budget-vs-actual by category for any month or quarter.' },\n      ],\n      postTitle: this.state.postTitle, onPostTitle: e => this.setState({ postTitle: e.target.value }),\n      postBody: this.state.postBody, onPostBody: e => this.setState({ postBody: e.target.value }),\n      postCatChips, postRows, notifyCount: notifyMap[this.state.postCat] || 0,\n      publishBtn: canPublish ? primaryBtn : disabledBtn,\n      publish: () => { if (!canPublish) return this.toast(this.can('publish') ? 'Add a title and some text first.' : 'Only the Director can publish to the website.'); this.addPost('published'); },\n      saveDraft: () => { if (!this.state.postTitle.trim()) return this.toast('Add a title first.'); this.addPost('draft'); },\n      users,\n    };\n  }\n\n  addPost(status) {\n    const p = { id: Date.now(), date: '2026-09-21', cat: this.state.postCat, title: this.state.postTitle, body: this.state.postBody, status, img: '' };\n    this.setState(s => ({ posts: [p, ...s.posts], postTitle: '', postBody: '' }));\n    this.toast(status === 'published' ? 'Published to the website. Subscribers notified.' : 'Draft saved.');\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
